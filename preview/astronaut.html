<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset evaluation · Tevy astronaut (temporary)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #020306; color: #b8c0cc; overflow: hidden; }
      body { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      canvas { display: block; }
      #panel {
        position: fixed; top: 16px; left: 16px; width: 270px; padding: 14px 16px;
        background: rgba(8, 10, 14, 0.72); border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(6px);
      }
      #panel h1 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: #e6e9ee; font-weight: 500; }
      #panel .tag { color: #c98a3e; }
      #panel fieldset { border: 0; padding: 0; margin: 10px 0 0; }
      #panel legend { color: #6c7480; text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; margin-bottom: 4px; }
      #panel label { display: block; cursor: pointer; }
      #panel input[type=range] { width: 100%; }
      #stats { white-space: pre; color: #8d95a1; margin-top: 10px; font-size: 11px; }
      #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: #4c535d; font-size: 11px; }
      #error { position: fixed; inset: 0; display: none; place-items: center; color: #d88; padding: 40px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Asset evaluation <span class="tag">· temporary</span></h1>
      <div>Tevy “Astronaut in Spacesuit” v1 · LOD0 · CC0</div>

      <fieldset id="clips"><legend>Animation clip</legend></fieldset>

      <fieldset>
        <legend>Zero-g test</legend>
        <label><input type="checkbox" id="drift" /> Slow drift + tumble on root</label>
      </fieldset>

      <fieldset>
        <legend>Lighting</legend>
        <label><input type="radio" name="light" value="interstellar" checked /> Hard sun key + cool rim</label>
        <label><input type="radio" name="light" value="rimonly" /> Rim only (silhouette test)</label>
        <label><input type="radio" name="light" value="soft" /> Soft studio (neutral check)</label>
        <label>Exposure <input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="1" /></label>
      </fieldset>

      <fieldset>
        <legend>Inspect</legend>
        <label><input type="checkbox" id="wire" /> Wireframe</label>
        <label><input type="checkbox" id="normalmap" checked /> Normal map</label>
        <label><input type="checkbox" id="skeleton" /> Skeleton</label>
        <label><input type="checkbox" id="bounds" /> Bounds + origin axes</label>
        <label><input type="checkbox" id="env" checked /> Faint reflection env</label>
      </fieldset>

      <div id="stats">loading…</div>
    </div>
    <div id="hint">drag to orbit · right-drag to pan · scroll to zoom</div>
    <div id="error"></div>
    <script type="module" src="./astronaut.ts"></script>
  </body>
</html>
